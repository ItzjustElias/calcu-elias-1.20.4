plugins {
	id 'fabric-loom' version '1.6.8'  // Use a stable release of Fabric Loom
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add any repositories you need here.
}

fabricApi {
	configureDataGeneration()
}

dependencies {
	// Minecraft version 1.21.1 and corresponding mappings, loader, etc.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"  // Should point to 1.21.1 in gradle.properties
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Additional dependencies.
	implementation 'net.objecthunter:exp4j:0.4.8'

	// Fabric API for Minecraft 1.21.1
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// Set to Java 21 as we are targeting Java 21
	it.options.release = 21
}

java {
	// Enable sources jar
	withSourcesJar()

	// Set source and target compatibility to Java 21
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// Repositories for publishing your artifacts
	repositories {
		// Add your Maven repository here for publishing
	}
}
